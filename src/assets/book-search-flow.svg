<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-labelledby="bs-title">
  <title id="bs-title">Kitob qidiruv ilovasi ma'lumot oqimi: input soz state'ini o'zgartiradi, useDebounce 500 ms dan keyin qidiruvSozi beradi, undan url hisoblanadi, Natijalar komponenti key=url bilan useFetch orqali Open Library'dan yuklaydi; sevimlilar useLocalStorage'da</title>
  <defs>
    <marker id="bs-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c67139" />
    </marker>
    <marker id="bs-arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7a8a5e" />
    </marker>
  </defs>
  <rect width="680" height="330" fill="#ffffff" />

  <rect x="20" y="30" width="140" height="56" rx="10" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="90" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#402310" font-family="sans-serif">QidiruvMaydoni</text>
  <text x="90" y="73" text-anchor="middle" font-size="11" fill="#402310" font-family="monospace">soz = "samar"</text>

  <rect x="190" y="30" width="140" height="56" rx="10" fill="#f0fae1" stroke="#7a8a5e" stroke-width="2" />
  <text x="260" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d472b" font-family="sans-serif">useDebounce</text>
  <text x="260" y="73" text-anchor="middle" font-size="11" fill="#3d472b" font-family="sans-serif">500 ms jimlikdan keyin</text>

  <rect x="360" y="30" width="140" height="56" rx="10" fill="#ffffff" stroke="#c67139" stroke-width="2" />
  <text x="430" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#402310" font-family="sans-serif">url</text>
  <text x="430" y="73" text-anchor="middle" font-size="11" fill="#6a675e" font-family="sans-serif">hisoblanadi (yoki null)</text>

  <rect x="530" y="30" width="130" height="56" rx="10" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="595" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#402310" font-family="sans-serif">&lt;Natijalar key={url}&gt;</text>
  <text x="595" y="73" text-anchor="middle" font-size="11" fill="#402310" font-family="monospace">useFetch(url)</text>

  <line x1="160" y1="58" x2="186" y2="58" stroke="#c67139" stroke-width="2" marker-end="url(#bs-arrow)" />
  <line x1="330" y1="58" x2="356" y2="58" stroke="#c67139" stroke-width="2" marker-end="url(#bs-arrow)" />
  <line x1="500" y1="58" x2="526" y2="58" stroke="#c67139" stroke-width="2" marker-end="url(#bs-arrow)" />

  <rect x="510" y="140" width="160" height="50" rx="10" fill="#ffffff" stroke="#7a8a5e" stroke-width="2" stroke-dasharray="5,4" />
  <text x="590" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d472b" font-family="sans-serif">Open Library API</text>
  <text x="590" y="180" text-anchor="middle" font-size="10" fill="#6a675e" font-family="monospace">search.json?q=...</text>
  <line x1="595" y1="86" x2="595" y2="136" stroke="#7a8a5e" stroke-width="2" marker-end="url(#bs-arrow2)" />
  <text x="604" y="114" font-size="10" fill="#6a675e" font-family="sans-serif">AbortController</text>

  <rect x="300" y="230" width="190" height="56" rx="10" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="395" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#402310" font-family="sans-serif">KitobKartasi ×24</text>
  <text x="395" y="272" text-anchor="middle" font-size="11" fill="#402310" font-family="monospace">♡ → onSevimli(kitob)</text>
  <path d="M560,86 C560,200 520,240 494,252" fill="none" stroke="#c67139" stroke-width="2" marker-end="url(#bs-arrow)" />

  <rect x="20" y="230" width="210" height="56" rx="10" fill="#f0fae1" stroke="#7a8a5e" stroke-width="2" />
  <text x="125" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d472b" font-family="sans-serif">App: useLocalStorage</text>
  <text x="125" y="272" text-anchor="middle" font-size="11" fill="#3d472b" font-family="monospace">sevimlilar ↔ localStorage</text>
  <path d="M300,258 L234,258" fill="none" stroke="#7a8a5e" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#bs-arrow2)" />

  <text x="340" y="318" text-anchor="middle" font-size="12" fill="#6a675e" font-family="sans-serif">Har bir harf state'ni o'zgartiradi, lekin so'rov faqat foydalanuvchi to'xtaganda ketadi</text>
</svg>
