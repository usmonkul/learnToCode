<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="rc-title">
  <title id="rc-title">React ekranni uch bosqichda yangilaydi: trigger (state o'zgardi), render (komponent chaqiriladi), commit (DOM yangilanadi), keyin brauzer chizadi</title>
  <defs>
    <marker id="rc-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c67139" />
    </marker>
  </defs>
  <rect width="640" height="220" fill="#ffffff" />

  <rect x="20" y="50" width="130" height="80" rx="10" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="85" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#402310" font-family="sans-serif">1. Trigger</text>
  <text x="85" y="102" text-anchor="middle" font-size="12" fill="#402310" font-family="sans-serif">setSoni(1)</text>
  <text x="85" y="118" text-anchor="middle" font-size="11" fill="#6a675e" font-family="sans-serif">yoki birinchi ochilish</text>

  <rect x="180" y="50" width="130" height="80" rx="10" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="245" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#402310" font-family="sans-serif">2. Render</text>
  <text x="245" y="102" text-anchor="middle" font-size="12" fill="#402310" font-family="sans-serif">Hisoblagich()</text>
  <text x="245" y="118" text-anchor="middle" font-size="11" fill="#6a675e" font-family="sans-serif">yangi JSX hisoblanadi</text>

  <rect x="340" y="50" width="130" height="80" rx="10" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="405" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#402310" font-family="sans-serif">3. Commit</text>
  <text x="405" y="102" text-anchor="middle" font-size="12" fill="#402310" font-family="sans-serif">DOM'ga yozish</text>
  <text x="405" y="118" text-anchor="middle" font-size="11" fill="#6a675e" font-family="sans-serif">faqat farq qilgan joy</text>

  <rect x="500" y="50" width="120" height="80" rx="10" fill="#f0fae1" stroke="#7a8a5e" stroke-width="2" />
  <text x="560" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#3d472b" font-family="sans-serif">Paint</text>
  <text x="560" y="102" text-anchor="middle" font-size="12" fill="#3d472b" font-family="sans-serif">brauzer chizadi</text>
  <text x="560" y="118" text-anchor="middle" font-size="11" fill="#6a675e" font-family="sans-serif">React emas</text>

  <line x1="150" y1="90" x2="176" y2="90" stroke="#c67139" stroke-width="2" marker-end="url(#rc-arrow)" />
  <line x1="310" y1="90" x2="336" y2="90" stroke="#c67139" stroke-width="2" marker-end="url(#rc-arrow)" />
  <line x1="470" y1="90" x2="496" y2="90" stroke="#c67139" stroke-width="2" marker-end="url(#rc-arrow)" />

  <text x="320" y="180" text-anchor="middle" font-size="13" fill="#6a675e" font-family="sans-serif">Render — faqat hisoblash (sof). Ekran faqat commit'dan keyin o'zgaradi.</text>
</svg>
