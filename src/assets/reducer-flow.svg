<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="rf-title">
  <title id="rf-title">Reducer oqimi: event handler dispatch orqali action yuboradi, React reducer'ni joriy state va action bilan chaqiradi, reducer yangi state qaytaradi, komponent qayta render bo'ladi</title>
  <defs>
    <marker id="rf-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c67139" />
    </marker>
  </defs>
  <rect width="640" height="250" fill="#ffffff" />

  <rect x="20" y="30" width="170" height="70" rx="10" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="105" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#402310" font-family="sans-serif">Event handler</text>
  <text x="105" y="80" text-anchor="middle" font-size="11" fill="#402310" font-family="monospace">onClick, onSubmit...</text>

  <rect x="235" y="30" width="170" height="70" rx="10" fill="#f0fae1" stroke="#7a8a5e" stroke-width="2" />
  <text x="320" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d472b" font-family="sans-serif">dispatch(action)</text>
  <text x="320" y="78" text-anchor="middle" font-size="11" fill="#3d472b" font-family="monospace">{ type: 'ochirish', id }</text>
  <text x="320" y="92" text-anchor="middle" font-size="10" fill="#6a675e" font-family="sans-serif">"nima bo'ldi"</text>

  <rect x="450" y="30" width="170" height="70" rx="10" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="535" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#402310" font-family="sans-serif">reducer</text>
  <text x="535" y="78" text-anchor="middle" font-size="11" fill="#402310" font-family="monospace">(state, action) =&gt;</text>
  <text x="535" y="92" text-anchor="middle" font-size="10" fill="#6a675e" font-family="sans-serif">"state qanday o'zgaradi"</text>

  <rect x="450" y="150" width="170" height="60" rx="10" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="535" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#402310" font-family="sans-serif">yangi state</text>
  <text x="535" y="196" text-anchor="middle" font-size="11" fill="#6a675e" font-family="sans-serif">React saqlaydi</text>

  <rect x="20" y="150" width="170" height="60" rx="10" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="105" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#402310" font-family="sans-serif">qayta render</text>
  <text x="105" y="196" text-anchor="middle" font-size="11" fill="#6a675e" font-family="sans-serif">yangi JSX</text>

  <line x1="190" y1="65" x2="231" y2="65" stroke="#c67139" stroke-width="2" marker-end="url(#rf-arrow)" />
  <line x1="405" y1="65" x2="446" y2="65" stroke="#c67139" stroke-width="2" marker-end="url(#rf-arrow)" />
  <line x1="535" y1="100" x2="535" y2="146" stroke="#c67139" stroke-width="2" marker-end="url(#rf-arrow)" />
  <line x1="450" y1="180" x2="194" y2="180" stroke="#c67139" stroke-width="2" marker-end="url(#rf-arrow)" />
  <line x1="105" y1="150" x2="105" y2="104" stroke="#c67139" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#rf-arrow)" />
  <text x="115" y="132" font-size="10" fill="#6a675e" font-family="sans-serif">keyingi hodisa</text>

  <text x="320" y="238" text-anchor="middle" font-size="12" fill="#6a675e" font-family="sans-serif">Komponent "nima bo'ldi"ni aytadi, reducer "qanday o'zgaradi"ni hal qiladi</text>
</svg>
