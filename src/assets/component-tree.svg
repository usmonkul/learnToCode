<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="component-tree-title">
  <title id="component-tree-title">App komponentidan tarkib topgan komponentlar daraxti</title>
  <defs>
    <marker id="tree-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f46e5" />
    </marker>
  </defs>

  <line x1="240" y1="54" x2="115" y2="110" stroke="#4f46e5" stroke-width="2" marker-end="url(#tree-arrow)" />
  <line x1="240" y1="54" x2="365" y2="110" stroke="#4f46e5" stroke-width="2" marker-end="url(#tree-arrow)" />
  <line x1="365" y1="154" x2="295" y2="210" stroke="#4f46e5" stroke-width="2" marker-end="url(#tree-arrow)" />
  <line x1="365" y1="154" x2="405" y2="210" stroke="#4f46e5" stroke-width="2" marker-end="url(#tree-arrow)" />

  <rect x="190" y="10" width="100" height="44" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="240" y="37" text-anchor="middle" font-size="14" fill="#312e81" font-family="sans-serif">App</text>

  <rect x="60" y="110" width="110" height="44" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="115" y="137" text-anchor="middle" font-size="14" fill="#312e81" font-family="sans-serif">Header</text>

  <rect x="310" y="110" width="110" height="44" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="365" y="137" text-anchor="middle" font-size="14" fill="#312e81" font-family="sans-serif">List</text>

  <rect x="250" y="210" width="90" height="40" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
  <text x="295" y="235" text-anchor="middle" font-size="12" fill="#312e81" font-family="sans-serif">Element 1</text>

  <rect x="360" y="210" width="90" height="40" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
  <text x="405" y="235" text-anchor="middle" font-size="12" fill="#312e81" font-family="sans-serif">Element 2</text>

  <text x="240" y="290" text-anchor="middle" font-size="12" fill="#475569" font-family="sans-serif">Har bir quti — alohida komponent; App ularni o'z ichiga joylashtirib chaqiradi</text>
