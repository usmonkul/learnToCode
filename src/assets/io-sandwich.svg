<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" role="img" aria-labelledby="io-sandwich-title">
  <title id="io-sandwich-title">Kirish, qayta ishlash va chiqish jarayoni sxemasi</title>
  <defs>
    <marker id="io-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c67139" />
    </marker>
  </defs>

  <rect x="10" y="60" width="140" height="100" rx="16" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <circle cx="80" cy="95" r="14" fill="#ffe1d0" stroke="#c67139" stroke-width="2" />
  <path d="M74,95 a6,6 0 1 0 12,0 a6,6 0 1 0 -12,0" fill="none" />
  <text x="80" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#402310" font-family="sans-serif">KIRISH</text>
  <text x="80" y="147" text-anchor="middle" font-size="11" fill="#6a675e" font-family="sans-serif">(klaviatura, ovoz)</text>

  <line x1="150" y1="110" x2="200" y2="110" stroke="#c67139" stroke-width="3" marker-end="url(#io-arrow)" />

  <rect x="200" y="50" width="140" height="120" rx="16" fill="#f0fae1" stroke="#7a8a5e" stroke-width="2" />
  <circle cx="270" cy="95" r="16" fill="#e1eecc" stroke="#7a8a5e" stroke-width="2" />
  <path d="M270,83 v24 M258,95 h24 M262,87 l16,16 M262,103 l16,-16" stroke="#56633f" stroke-width="2" />
  <text x="270" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#272e1b" font-family="sans-serif">QAYTA</text>
  <text x="270" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#272e1b" font-family="sans-serif">ISHLASH</text>
  <text x="270" y="167" text-anchor="middle" font-size="11" fill="#56633f" font-family="sans-serif">(protsessor)</text>

  <line x1="340" y1="110" x2="390" y2="110" stroke="#c67139" stroke-width="3" marker-end="url(#io-arrow)" />

  <rect x="390" y="60" width="140" height="100" rx="16" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <rect x="425" y="85" width="70" height="46" rx="4" fill="#ffe1d0" stroke="#c67139" stroke-width="2" />
  <line x1="450" y1="131" x2="450" y2="140" stroke="#c67139" stroke-width="2" />
  <line x1="435" y1="140" x2="465" y2="140" stroke="#c67139" stroke-width="2" />
  <text x="460" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#402310" font-family="sans-serif" dy="8">CHIQISH</text>
  <text x="460" y="176" text-anchor="middle" font-size="11" fill="#6a675e" font-family="sans-serif">(ekran, ovoz)</text>
</svg>
