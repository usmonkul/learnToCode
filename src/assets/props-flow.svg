<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="props-flow-title">
  <title id="props-flow-title">Props'ning ota komponentdan bola komponentga bir tomonlama oqishi</title>
  <defs>
    <marker id="props-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f46e5" />
    </marker>
  </defs>

  <rect x="90" y="10" width="200" height="56" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="190" y="33" text-anchor="middle" font-size="14" fill="#312e81" font-family="sans-serif" font-weight="bold">Ota komponent</text>
  <text x="190" y="52" text-anchor="middle" font-size="12" fill="#475569" font-family="sans-serif">&lt;Bola ism="Aziz" /&gt;</text>

  <line x1="190" y1="66" x2="190" y2="148" stroke="#4f46e5" stroke-width="2" marker-end="url(#props-arrow)" />
  <rect x="150" y="94" width="80" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" />
  <text x="190" y="111" text-anchor="middle" font-size="12" fill="#312e81" font-family="sans-serif">props</text>

  <rect x="90" y="150" width="200" height="56" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="190" y="173" text-anchor="middle" font-size="14" fill="#312e81" font-family="sans-serif" font-weight="bold">Bola komponent</text>
  <text x="190" y="192" text-anchor="middle" font-size="12" fill="#475569" font-family="sans-serif">function Bola({ ism })</text>

  <path d="M290,178 H340 V38 H290" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#props-arrow)" />
  <line x1="332" y1="100" x2="348" y2="116" stroke="#4f46e5" stroke-width="2" />
  <line x1="348" y1="100" x2="332" y2="116" stroke="#4f46e5" stroke-width="2" />
  <text x="355" y="112" text-anchor="start" font-size="12" fill="#475569" font-family="sans-serif">yo'q</text>

  <text x="200" y="260" text-anchor="middle" font-size="12" fill="#475569" font-family="sans-serif">Props faqat bir tomonga oqadi: ota &#8594; bola</text>
</svg>
