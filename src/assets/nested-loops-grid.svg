<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340" role="img" aria-labelledby="nested-loops-grid-title">
  <title id="nested-loops-grid-title">Ichma-ich siklning bosib o'tish tartibi: tashqi sikl (i) va ichki sikl (j)</title>
  <defs>
    <marker id="nested-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f46e5" />
    </marker>
  </defs>

  <text x="197" y="26" text-anchor="middle" font-size="13" fill="#475569" font-family="sans-serif">ichki sikl (j) &#8594;</text>
  <text x="18" y="200" text-anchor="middle" font-size="13" fill="#475569" font-family="sans-serif" transform="rotate(-90 18 200)">tashqi sikl (i) &#8595;</text>

  <text x="140" y="54" text-anchor="middle" font-size="13" fill="#312e81" font-family="sans-serif">j = 0</text>
  <text x="254" y="54" text-anchor="middle" font-size="13" fill="#312e81" font-family="sans-serif">j = 1</text>

  <text x="52" y="117" text-anchor="middle" font-size="13" fill="#312e81" font-family="sans-serif">i = 0</text>
  <text x="52" y="201" text-anchor="middle" font-size="13" fill="#312e81" font-family="sans-serif">i = 1</text>
  <text x="52" y="285" text-anchor="middle" font-size="13" fill="#312e81" font-family="sans-serif">i = 2</text>

  <!-- row i=0 -->
  <rect x="90" y="78" width="100" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="140" y="107" text-anchor="middle" font-size="18" fill="#312e81" font-family="sans-serif">1</text>
  <text x="140" y="129" text-anchor="middle" font-size="12" fill="#475569" font-family="sans-serif">(0, 0)</text>

  <rect x="204" y="78" width="100" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="254" y="107" text-anchor="middle" font-size="18" fill="#312e81" font-family="sans-serif">2</text>
  <text x="254" y="129" text-anchor="middle" font-size="12" fill="#475569" font-family="sans-serif">(0, 1)</text>

  <!-- row i=1 -->
  <rect x="90" y="162" width="100" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="140" y="191" text-anchor="middle" font-size="18" fill="#312e81" font-family="sans-serif">3</text>
  <text x="140" y="213" text-anchor="middle" font-size="12" fill="#475569" font-family="sans-serif">(1, 0)</text>

  <rect x="204" y="162" width="100" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="254" y="191" text-anchor="middle" font-size="18" fill="#312e81" font-family="sans-serif">4</text>
  <text x="254" y="213" text-anchor="middle" font-size="12" fill="#475569" font-family="sans-serif">(1, 1)</text>

  <!-- row i=2 -->
  <rect x="90" y="246" width="100" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="140" y="275" text-anchor="middle" font-size="18" fill="#312e81" font-family="sans-serif">5</text>
  <text x="140" y="297" text-anchor="middle" font-size="12" fill="#475569" font-family="sans-serif">(2, 0)</text>

  <rect x="204" y="246" width="100" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="254" y="275" text-anchor="middle" font-size="18" fill="#312e81" font-family="sans-serif">6</text>
  <text x="254" y="297" text-anchor="middle" font-size="12" fill="#475569" font-family="sans-serif">(2, 1)</text>

  <!-- visiting-order arrows -->
  <line x1="191" y1="113" x2="203" y2="113" stroke="#4f46e5" stroke-width="2" marker-end="url(#nested-arrow)" />
  <path d="M254,150 C230,180 170,180 143,160" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#nested-arrow)" />
  <line x1="191" y1="197" x2="203" y2="197" stroke="#4f46e5" stroke-width="2" marker-end="url(#nested-arrow)" />
  <path d="M254,234 C230,264 170,264 143,244" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#nested-arrow)" />
  <line x1="191" y1="281" x2="203" y2="281" stroke="#4f46e5" stroke-width="2" marker-end="url(#nested-arrow)" />
</svg>
