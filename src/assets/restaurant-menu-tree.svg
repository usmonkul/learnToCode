<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-labelledby="rm-tree-title">
  <title id="rm-tree-title">Osh markazi menyusi komponentlar daraxti: App ichida Sarlavha va har bir bo'lim uchun Bolim; Bolim ichida TaomKartasi; TaomKartasi ichida Belgi va Narx</title>
