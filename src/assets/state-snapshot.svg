<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="ss-title">
  <title id="ss-title">State — har bir render uchun suratga olingan qiymat: birinchi renderda soni 0, uning handler'idagi uchala setSoni(soni + 1) ham 0 + 1 ni hisoblaydi, natijada keyingi renderda soni 1</title>
  <defs>
    <marker id="ss-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c67139" />
    </marker>
  </defs>
  <rect width="640" height="260" fill="#ffffff" />

  <rect x="20" y="20" width="300" height="170" rx="12" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="40" y="48" font-size="15" font-weight="bold" fill="#402310" font-family="sans-serif">1-render: surat — soni = 0</text>
  <text x="40" y="82" font-size="13" fill="#402310" font-family="monospace">setSoni(soni + 1)  → 0 + 1</text>
  <text x="40" y="106" font-size="13" fill="#402310" font-family="monospace">setSoni(soni + 1)  → 0 + 1</text>
  <text x="40" y="130" font-size="13" fill="#402310" font-family="monospace">setSoni(soni + 1)  → 0 + 1</text>
  <text x="40" y="164" font-size="12" fill="#6a675e" font-family="sans-serif">handler ichida soni o'zgarmaydi — doim 0</text>

  <line x1="320" y1="105" x2="376" y2="105" stroke="#c67139" stroke-width="2" marker-end="url(#ss-arrow)" />
  <text x="348" y="96" text-anchor="middle" font-size="11" fill="#6a675e" font-family="sans-serif">navbat:</text>
  <text x="348" y="124" text-anchor="middle" font-size="11" fill="#6a675e" font-family="sans-serif">1, 1, 1</text>

  <rect x="380" y="20" width="240" height="170" rx="12" fill="#f0fae1" stroke="#7a8a5e" stroke-width="2" />
  <text x="400" y="48" font-size="15" font-weight="bold" fill="#3d472b" font-family="sans-serif">2-render: soni = 1</text>
  <text x="400" y="82" font-size="13" fill="#3d472b" font-family="sans-serif">React navbatdagi oxirgi</text>
  <text x="400" y="104" font-size="13" fill="#3d472b" font-family="sans-serif">qiymatni oladi: 1</text>
  <text x="400" y="138" font-size="13" fill="#3d472b" font-family="sans-serif">Kutilgan 3 emas!</text>

  <text x="320" y="230" text-anchor="middle" font-size="13" fill="#6a675e" font-family="sans-serif">Updater bilan: setSoni(s =&gt; s + 1) ×3 → navbat 0→1→2→3, keyingi renderda 3</text>
</svg>
