<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-labelledby="hw-tree-title">
  <title id="hw-tree-title">Uy vazifalari ilovasi komponentlar daraxti: App vazifalar va filtr state'ini saqlaydi; VazifaFormasi, FiltrPaneli va har bir vazifa uchun VazifaQatori'ga props va handler'lar uzatadi</title>
  <defs>
    <marker id="hw-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c67139" />
    </marker>
    <marker id="hw-arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7a8a5e" />
    </marker>
  </defs>
  <rect width="600" height="330" fill="#ffffff" />

  <rect x="200" y="14" width="200" height="66" rx="10" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="300" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#402310" font-family="sans-serif">App</text>
  <text x="300" y="62" text-anchor="middle" font-size="12" fill="#402310" font-family="monospace">state: vazifalar, filtr</text>

  <line x1="240" y1="80" x2="110" y2="150" stroke="#c67139" stroke-width="2" marker-end="url(#hw-arrow)" />
  <line x1="300" y1="80" x2="300" y2="150" stroke="#c67139" stroke-width="2" marker-end="url(#hw-arrow)" />
  <line x1="360" y1="80" x2="490" y2="150" stroke="#c67139" stroke-width="2" marker-end="url(#hw-arrow)" />

  <rect x="30" y="150" width="160" height="66" rx="10" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="110" y="176" text-anchor="middle" font-size="14" fill="#402310" font-family="sans-serif">VazifaFormasi</text>
  <text x="110" y="198" text-anchor="middle" font-size="11" fill="#6a675e" font-family="monospace">state: forma</text>

  <rect x="220" y="150" width="160" height="66" rx="10" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="300" y="176" text-anchor="middle" font-size="14" fill="#402310" font-family="sans-serif">FiltrPaneli</text>
  <text x="300" y="198" text-anchor="middle" font-size="11" fill="#6a675e" font-family="monospace">filtr, qolganSoni</text>

  <rect x="410" y="150" width="160" height="66" rx="10" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="490" y="176" text-anchor="middle" font-size="14" fill="#402310" font-family="sans-serif">VazifaQatori</text>
  <text x="490" y="198" text-anchor="middle" font-size="11" fill="#6a675e" font-family="sans-serif">× har vazifa</text>

  <path d="M110,216 C110,262 200,262 214,90" fill="none" stroke="#7a8a5e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#hw-arrow2)" />
  <text x="40" y="250" font-size="11" fill="#3d472b" font-family="monospace">onQoshish(yangi)</text>
  <path d="M300,216 C300,250 310,250 300,84" fill="none" stroke="#7a8a5e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#hw-arrow2)" />
  <text x="312" y="240" font-size="11" fill="#3d472b" font-family="monospace">onFiltr(f)</text>
  <path d="M490,216 C490,262 400,262 386,90" fill="none" stroke="#7a8a5e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#hw-arrow2)" />
  <text x="430" y="250" font-size="11" fill="#3d472b" font-family="monospace">onAlmashtir(id)</text>
  <text x="430" y="266" font-size="11" fill="#3d472b" font-family="monospace">onOchirish(id)</text>

  <line x1="30" y1="300" x2="60" y2="300" stroke="#c67139" stroke-width="2" />
  <text x="68" y="304" font-size="12" fill="#6a675e" font-family="sans-serif">props pastga</text>
  <line x1="180" y1="300" x2="210" y2="300" stroke="#7a8a5e" stroke-width="1.5" stroke-dasharray="5,4" />
  <text x="218" y="304" font-size="12" fill="#6a675e" font-family="sans-serif">hodisalar yuqoriga (handler props orqali)</text>
</svg>
