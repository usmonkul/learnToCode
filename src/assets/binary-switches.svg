<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" role="img" aria-labelledby="binary-switches-title">
  <title id="binary-switches-title">Yonib-o'chib turuvchi sakkizta chiroqcha — bitta bayt</title>

  <text x="250" y="28" text-anchor="middle" font-size="14" fill="#6a675e" font-family="sans-serif">1 BAYT = 8 BIT (8 ta chiroqcha)</text>

  <g font-family="sans-serif">
    <g transform="translate(20,50)">
