      <text x="25" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#8c491a">0</text>
      <text x="25" y="78" text-anchor="middle" font-size="11" fill="#6a675e">o'chiq</text>
    </g>
    <g transform="translate(440,50)">
      <circle cx="25" cy="30" r="24" fill="#c67139" stroke="#8c491a" stroke-width="2" />
      <text x="25" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff8f4">1</text>
