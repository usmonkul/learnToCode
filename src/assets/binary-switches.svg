  <text x="250" y="160" text-anchor="middle" font-size="13" fill="#402310" font-family="sans-serif">Har bir chiroqcha — kompyuter uchun bitta savol: "yonganmi yoki yo'qmi?"</text>
  <text x="250" y="180" text-anchor="middle" font-size="13" fill="#402310" font-family="sans-serif">Shu oddiy savollardan harflar, rasmlar va o'yinlar yasaladi.</text>
</svg>
