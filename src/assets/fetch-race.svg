<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img" aria-labelledby="fr-title">
  <title id="fr-title">Fetch poygasi: foydalanuvchi avval 1-ni, keyin 2-ni tanlaydi; 2-so'rov tezroq javob beradi, 1-so'rov kechikib keladi va ignore bayrog'isiz ekrandagi to'g'ri ma'lumot ustiga yoziladi</title>
  <defs>
    <marker id="fr-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c67139" />
    </marker>
    <marker id="fr-arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7a8a5e" />
    </marker>
  </defs>
  <rect width="680" height="280" fill="#ffffff" />

  <line x1="30" y1="230" x2="660" y2="230" stroke="#e3e1da" stroke-width="3" marker-end="url(#fr-arrow)" />
  <text x="650" y="252" text-anchor="end" font-size="11" fill="#6a675e" font-family="sans-serif">vaqt</text>

  <text x="40" y="40" font-size="12" font-weight="bold" fill="#402310" font-family="sans-serif">id = 1 tanlandi</text>
  <rect x="40" y="52" width="520" height="30" rx="6" fill="#fff2eb" stroke="#c67139" stroke-width="2" />
  <text x="300" y="72" text-anchor="middle" font-size="12" fill="#402310" font-family="sans-serif">1-so'rov: sekin tarmoq... ⏳</text>

  <text x="160" y="112" font-size="12" font-weight="bold" fill="#3d472b" font-family="sans-serif">id = 2 tanlandi</text>
  <rect x="160" y="124" width="200" height="30" rx="6" fill="#f0fae1" stroke="#7a8a5e" stroke-width="2" />
  <text x="260" y="144" text-anchor="middle" font-size="12" fill="#3d472b" font-family="sans-serif">2-so'rov: tez ⚡</text>

  <line x1="360" y1="154" x2="360" y2="222" stroke="#7a8a5e" stroke-width="2" marker-end="url(#fr-arrow2)" />
  <text x="368" y="196" font-size="11" fill="#3d472b" font-family="sans-serif">ekranda 2 ✓</text>

  <line x1="560" y1="82" x2="560" y2="222" stroke="#c67139" stroke-width="2" marker-end="url(#fr-arrow)" />
  <text x="568" y="160" font-size="11" fill="#b42318" font-family="sans-serif">ekranda 1 ✗</text>
  <text x="568" y="176" font-size="11" fill="#6a675e" font-family="sans-serif">(tanlangan — 2!)</text>

  <text x="340" y="272" text-anchor="middle" font-size="12" fill="#6a675e" font-family="sans-serif">Javoblar yuborilgan tartibda kelishi shart emas — eski javobni e'tiborsiz qoldirish kerak</text>
</svg>
